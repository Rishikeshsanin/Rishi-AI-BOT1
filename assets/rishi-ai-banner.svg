  <text x="188" y="158" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="56" font-weight="900" fill="white">Rishi AI BOT1</text>

  <text x="74" y="228" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" fill="#E7ECF7">Your AI when the internet disappears.</text>
