<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050814"/>
      <stop offset="0.5" stop-color="#12152B"/>
      <stop offset="1" stop-color="#061B20"/>
    </linearGradient>
    <linearGradient id="accent" x1="120" y1="80" x2="1060" y2="350" gradientUnits="userSpaceOnUse">
